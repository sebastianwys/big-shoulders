# monthly data bot. pulls the enrichment sources, rebuilds the map json and
# commits the result. a failed collector leaves the repo untouched and the run red
name: data bot

on:
  schedule:
    # the 25th, after zillow's mid-month release and bls's monthly metro data
    - cron: "17 9 25 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: run the collectors and rebuild the map data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python -m bot.run_bot

      - name: run the tests
        run: python run_tests.py

      # commits only if the previous steps passed, with the actions bot identity
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bot: monthly data refresh"
          file_pattern: "data/raw/gazetteer data/raw/zillow/download_manifest.json data/raw/bls data/raw/fred web/public/data"
